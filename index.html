<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing Notebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .hero {
            text-align: center;
            padding: 100px 20px 60px;
        }

        .hero h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            margin: 0 0 20px 0;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .lectures-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 60px;
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        }

        .lecture-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
            display: block;
        }

        .lecture-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .card-number {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            opacity: 0.1;
            position: absolute;
            top: -10px;
            right: 20px;
            transition: opacity 0.3s;
        }

        .lecture-card:hover .card-number {
            opacity: 0.3;
            color: var(--accent);
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            position: relative;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .read-btn {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .lecture-card:hover .read-btn {
            background: var(--accent);
            color: white;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 3rem; }
            .lectures-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Cloud Computing</h1>
        <p>A comprehensive notebook covering cloud architecture, virtualization, deployment models, and industry best practices.</p>
    </header>

    <main class="lectures-container">
        <!-- Lecture 1 Card -->
        <a href="lecture1.html" class="lecture-card">
            <div class="card-number">01</div>
            <div class="card-title">Week 5 - Handbook</div>
            <div class="card-desc">Elastic computing, data centers, virtualization, and public/private cloud models.</div>
            <div class="read-btn">Read Lecture →</div>
        </a>

        <!-- Add more lecture cards here in the future -->
        <!--
        <a href="lecture2.html" class="lecture-card">
            <div class="card-number">02</div>
            <div class="card-title">Next Lecture Title</div>
            <div class="card-desc">Brief description of what this lecture covers.</div>
            <div class="read-btn">Read Lecture →</div>
        </a>
        -->
    </main>

</body>
</html>
