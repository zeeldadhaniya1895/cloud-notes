<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cloud Computing Notebook containing lectures and handbooks.">
    <title>Cloud Computing Notebook</title>
    <!-- Marked.js for parsing Markdown to HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --bg-secondary: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --sidebar-width: 320px;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        #sidebar {
            width: var(--sidebar-width);
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        #sidebar h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 2rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .lecture-link {
            padding: 14px 18px;
            margin-bottom: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.03);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
            border: 1px solid transparent;
        }

        .lecture-link:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(6px);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .lecture-link.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            transform: translateX(6px);
        }

        /* Main Content Area */
        #content-wrapper {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            background: url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.05)"/></svg>') repeat;
        }

        #content {
            max-width: 850px;
            margin: 40px auto;
            background: var(--bg-secondary);
            padding: 50px 60px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            line-height: 1.8;
            font-size: 1.05rem;
            color: var(--text-muted);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Markdown Rendered Elements Styling */
        #content h1, #content h2, #content h3, #content h4 {
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            margin-top: 2em;
            margin-bottom: 0.75em;
            font-weight: 700;
        }

        #content h1 {
            font-size: 2.5rem;
            margin-top: 0;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        #content h2 {
            font-size: 1.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5em;
        }

        #content a {
            color: #60a5fa;
            text-decoration: none;
            border-bottom: 1px dashed rgba(96, 165, 250, 0.5);
            transition: all 0.2s;
        }

        #content a:hover {
            color: #93c5fd;
            border-bottom-style: solid;
        }

        #content p {
            margin-bottom: 1.5em;
        }

        #content ul, #content ol {
            margin-bottom: 1.5em;
            padding-left: 1.5em;
        }

        #content li {
            margin-bottom: 0.5em;
        }

        #content code { 
            background: rgba(0, 0, 0, 0.4); 
            padding: 0.2em 0.4em; 
            border-radius: 6px; 
            font-family: monospace;
            font-size: 0.9em;
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        #content pre {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 1.5em;
        }

        #content pre code {
            background: none;
            padding: 0;
            border: none;
            color: #93c5fd;
        }

        #content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2em 0;
            font-size: 0.95rem;
        }

        #content th, #content td {
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: left;
        }

        #content th { 
            background: rgba(255,255,255,0.03); 
            color: var(--text-main);
            font-weight: 600;
        }

        #content tr:nth-child(even) {
            background: rgba(255,255,255,0.01);
        }

        #content blockquote {
            border-left: 4px solid #8b5cf6;
            margin: 1.5em 0;
            padding: 1em 1.5em;
            background: rgba(139, 92, 246, 0.05);
            border-radius: 0 12px 12px 0;
            color: #e2e8f0;
            font-style: italic;
        }

        #content hr {
            border: 0;
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 3em 0;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Welcome screen styling */
        .welcome-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
        }
        
        .welcome-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 20px; }
            #content { margin: 20px; padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Cloud Computing</h1>
        <div id="lecture-list">
            <!-- Lectures will be injected here via JavaScript -->
        </div>
    </div>

    <div id="content-wrapper">
        <div id="content">
            <div class="welcome-screen">
                <div class="welcome-icon">☁️</div>
                <h1>Welcome to Your Notebook</h1>
                <p>Select a lecture from the sidebar to start reading.</p>
                <p style="font-size: 0.9em; opacity: 0.7; margin-top: 2em;">
                    <em>To add a new lecture, update the <code>lectures</code> array in index.html and add the corresponding markdown file to the folder.</em>
                </p>
            </div>
        </div>
    </div>

    <script>
        // --- ADD YOUR LECTURES HERE ---
        // To add a new lecture, just add an object to this array.
        // Make sure the 'file' property points to a valid markdown file in the same directory.
        const lectures = [
            { id: 'handbook', title: 'Cloud Computing Handbook', file: 'Cloud_Computing_Handbook.md' }
            // Example of adding another lecture:
            // { id: 'lec2', title: 'Lecture 2: Architecture', file: 'Lecture_2.md' }
        ];

        const listContainer = document.getElementById('lecture-list');
        const contentContainer = document.getElementById('content');

        // Initialize marked.js options for better formatting
        marked.setOptions({
            gfm: true, // GitHub Flavored Markdown
            breaks: true,
            headerIds: true
        });

        // Initialize sidebar
        lectures.forEach(lec => {
            const div = document.createElement('div');
            div.className = 'lecture-link';
            div.textContent = lec.title;
            div.onclick = () => loadLecture(lec, div);
            listContainer.appendChild(div);
        });

        async function loadLecture(lec, element) {
            // Update active state in sidebar
            document.querySelectorAll('.lecture-link').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            // Show loading state
            contentContainer.innerHTML = '<div style="text-align: center; opacity: 0.5;">Loading content...</div>';
            
            // Re-trigger animation
            contentContainer.style.animation = 'none';
            contentContainer.offsetHeight; // trigger reflow
            contentContainer.style.animation = null;

            try {
                const response = await fetch(lec.file);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const markdown = await response.text();
                
                // Parse markdown to HTML and inject
                contentContainer.innerHTML = marked.parse(markdown);
                
                // Scroll to top of content
                document.getElementById('content-wrapper').scrollTo(0, 0);
            } catch (error) {
                contentContainer.innerHTML = `
                    <div style="text-align: center; color: #ef4444;">
                        <h2>Error loading "${lec.title}"</h2>
                        <p>Could not fetch the file <code>${lec.file}</code>.</p>
                        <p style="font-size: 0.9em; opacity: 0.8; margin-top: 20px; text-align: left; background: rgba(239, 68, 68, 0.1); padding: 15px; border-radius: 8px;">
                            <strong>Note for Local Viewing:</strong> If you are opening this file directly from your computer (e.g. <code>file:///...</code>), your browser might block loading the markdown file due to security restrictions (CORS).<br><br>
                            To view it locally, you need to use a local web server. For example:<br>
                            - Use VS Code extension "Live Server"<br>
                            - Or run <code>python -m http.server</code> in this folder.<br><br>
                            <strong>This will work perfectly when deployed to GitHub Pages!</strong>
                        </p>
                    </div>`;
                console.error('Error fetching markdown:', error);
            }
        }
    </script>
</body>
</html>
