<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing | Table of Contents</title>
    <!-- Elegant Serif Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme (Classic Book) */
            --bg-paper: #FAF9F6;
            --text-ink: #2c2a29;
            --text-light: #595552;
            --accent: #8c2a2a;
            --border: #e6e2db;
            --theme-icon: "🌙 Dark Mode";
        }

        [data-theme="dark"] {
            /* Dark Theme (Elegant Night) */
            --bg-paper: #1a1918;
            --text-ink: #e0dbd5;
            --text-light: #9e988f;
            --accent: #d95c5c;
            --border: #33312e;
            --theme-icon: "☀️ Light Mode";
        }

        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-paper);
            color: var(--text-ink);
            margin: 0;
            padding: 0;
            line-height: 1.8;
            transition: background-color 0.3s, color 0.3s;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect width="4" height="4" fill="none"/><circle cx="2" cy="2" r="0.5" fill="rgba(128,128,128,0.05)"/></svg>');
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 20px 40px;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-ink);
            padding: 8px 16px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--text-light);
        }

        .theme-toggle::after {
            content: var(--theme-icon);
        }

        .book-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 40px 100px;
        }

        .title-page {
            text-align: center;
            margin-bottom: 80px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 60px;
        }

        .title-page h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            margin: 0 0 15px 0;
            color: var(--text-ink);
            letter-spacing: -1px;
        }

        .title-page .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-style: italic;
            color: var(--text-light);
            margin-bottom: 40px;
        }

        .title-page .author {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-light);
        }

        .table-of-contents {
            margin-top: 40px;
            padding: 0 40px;
        }

        .toc-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 60px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .chapter-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .chapter-item {
            margin-bottom: 35px;
            position: relative;
        }

        .chapter-link {
            display: flex;
            align-items: baseline;
            text-decoration: none;
            color: var(--text-ink);
            transition: color 0.2s;
        }

        .chapter-link:hover {
            color: var(--accent);
        }

        .chapter-number {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-style: italic;
            width: 50px;
            color: var(--text-light);
            transition: color 0.2s;
        }

        .chapter-link:hover .chapter-number {
            color: var(--accent);
        }

        .chapter-title {
            font-size: 1.25rem;
            flex-grow: 1;
            position: relative;
            background: var(--bg-paper);
            padding-right: 15px;
            z-index: 2;
            transition: background-color 0.3s;
        }

        .chapter-desc {
            display: block;
            font-size: 1rem;
            color: var(--text-light);
            margin-top: 8px;
            margin-left: 50px;
            font-style: italic;
        }

        .dotted-leader {
            flex-grow: 1;
            border-bottom: 2px dotted rgba(128, 128, 128, 0.4);
            margin: 0 15px;
            position: relative;
            top: -6px;
            z-index: 1;
        }
        
        .page-number {
            font-family: 'Playfair Display', serif;
            color: var(--text-light);
            background: var(--bg-paper);
            padding-left: 15px;
            z-index: 2;
            font-style: italic;
            font-size: 1.2rem;
            transition: background-color 0.3s;
        }

        @media (max-width: 768px) {
            .table-of-contents { padding: 0; }
            .title-page h1 { font-size: 3rem; }
            .chapter-link { flex-wrap: wrap; }
            .dotted-leader, .page-number { display: none; }
        }
    </style>
</head>
<body>
    
    <div class="top-bar">
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>
    </div>

    <div class="book-container">
        <div class="title-page">
            <h1>Cloud Computing</h1>
            <div class="subtitle">A Comprehensive Notebook</div>
            <div class="author">Semester 7</div>
        </div>

        <div class="table-of-contents">
            <h2 class="toc-title">Table of Contents</h2>
            <ul class="chapter-list">
                
                <li class="chapter-item">
                    <a href="lecture1.html" class="chapter-link">
                        <span class="chapter-number">I.</span>
                        <span class="chapter-title">Elastic Computing & the Cloud Landscape</span>
                        <div class="dotted-leader"></div>
                        <span class="page-number">1</span>
                    </a>
                    <span class="chapter-desc">Data centers, virtualization, and public vs private cloud models.</span>
                </li>

            </ul>
        </div>
    </div>

    <script>
        // Theme management
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
            document.body.setAttribute('data-theme', currentTheme);
        }

        function toggleTheme() {
            if (document.body.getAttribute('data-theme') === 'dark') {
                document.body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>
</body>
</html>
