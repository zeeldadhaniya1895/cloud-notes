<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter III - Cloud Architecture</title>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Elegant Serif Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme */
            --bg-paper: #FAF9F6;
            --text-ink: #2c2a29;
            --text-light: #595552;
            --accent: #8c2a2a;
            --border: #e6e2db;
            --code-bg: #f2efe9;
            --theme-icon: "🌙 Dark Mode";
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --bg-paper: #1a1918;
            --text-ink: #e0dbd5;
            --text-light: #9e988f;
            --accent: #d95c5c;
            --border: #33312e;
            --code-bg: #262423;
            --theme-icon: "☀️ Light Mode";
        }

        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-paper);
            color: var(--text-ink);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect width="4" height="4" fill="none"/><circle cx="2" cy="2" r="0.5" fill="rgba(128,128,128,0.05)"/></svg>');
        }

        /* Top Navigation */
        nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1rem;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--accent);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-ink);
            padding: 8px 16px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .theme-toggle:hover { border-color: var(--text-light); }
        .theme-toggle::after { content: var(--theme-icon); }

        /* Main Layout */
        .layout-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
            gap: 60px;
            align-items: flex-start;
        }

        /* Dynamic Sidebar TOC */
        .sidebar {
            flex: 0 0 300px;
            position: sticky;
            top: 40px;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            border-right: 1px solid var(--border);
            padding-right: 30px;
            font-size: 0.95rem;
        }

        /* Hide default scrollbar in sidebar for cleaner look */
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .sidebar h4 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.3rem;
            color: var(--text-light);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .toc-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .toc-item {
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .toc-item.h3 {
            padding-left: 20px;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .toc-link {
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.2s;
            display: block;
        }

        .toc-link:hover, .toc-link.active {
            color: var(--accent);
        }

        /* Main Content Area */
        #content-wrapper {
            flex: 1;
            min-width: 0;
        }

        #content {
            max-width: 70ch; /* Optimal reading width */
            margin: 0 auto;
            line-height: 1.9;
            font-size: 1.15rem;
            color: var(--text-ink);
        }

        /* Typography & Markdown Styling */
        #content h1, #content h2, #content h3, #content h4 {
            font-family: 'Playfair Display', serif;
            color: var(--text-ink);
            font-weight: 600;
            scroll-margin-top: 40px; /* Offset for anchor links */
        }

        #content h1 {
            font-size: 3.2rem;
            text-align: center;
            margin-bottom: 0.2em;
            margin-top: 0;
            line-height: 1.2;
        }

        #content h1 + h3, #content h1 + h2 {
            text-align: center;
            font-style: italic;
            font-weight: 400;
            color: var(--text-light);
            margin-top: 0;
            margin-bottom: 2.5em;
            font-size: 1.4rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2.5em;
        }

        #content h2 {
            font-size: 2rem;
            margin-top: 2.5em;
            margin-bottom: 1em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3em;
        }

        #content h3 {
            font-size: 1.5rem;
            margin-top: 2em;
            margin-bottom: 0.8em;
            font-style: italic;
        }

        #content p {
            margin-bottom: 1.5em;
            text-align: justify;
        }

        #content a {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
        }

        #content a:hover { color: var(--text-ink); }
        #content ul, #content ol { margin-bottom: 1.5em; padding-left: 2em; }
        #content li { margin-bottom: 0.5em; }

        #content blockquote {
            border-left: 3px solid var(--accent);
            margin: 2.5em 0;
            padding: 0.5em 0 0.5em 1.5em;
            font-style: italic;
            color: var(--text-light);
            font-size: 1.1rem;
        }

        #content table {
            width: 100%;
            border-collapse: collapse;
            margin: 3em 0;
            font-size: 0.95rem;
            font-family: 'Lora', serif;
        }

        #content th, #content td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        #content th { 
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            border-bottom: 2px solid var(--text-ink);
            color: var(--text-ink);
            font-size: 1.05rem;
        }
        
        #content tr:last-child td { border-bottom: 2px solid var(--border); }

        #content code { 
            background: var(--code-bg); 
            padding: 0.2em 0.4em; 
            border-radius: 4px; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            color: var(--text-ink);
        }

        #content pre {
            background: var(--code-bg);
            padding: 1.5em;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 2em;
            border: 1px solid var(--border);
        }

        #content pre code { background: none; padding: 0; border: none; font-size: 0.9em; }

        #content hr {
            border: 0;
            height: 1px;
            background: var(--border);
            margin: 4em 0;
            position: relative;
        }
        
        #content hr::after {
            content: "⁂";
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-paper);
            padding: 0 15px;
            color: var(--text-light);
            font-size: 1.5rem;
            font-family: serif;
        }

        #content > p:first-of-type::first-letter {
            float: left;
            font-size: 4rem;
            line-height: 0.7;
            padding-right: 12px;
            padding-top: 8px;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--text-ink);
        }

        /* Hide the manual markdown Table of Contents since we build a floating one */
        #content h2#table-of-contents,
        #content h2#table-of-contents + ul {
            display: none; 
        }
        
        @media (max-width: 1024px) {
            .sidebar { display: none; } /* Hide sidebar on smaller screens */
            .layout-container { justify-content: center; }
            #content { text-align: left; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">← Return to Table of Contents</a>
        <button class="theme-toggle" onclick="toggleTheme()"></button>
    </nav>

    <div class="layout-container">
        
        <!-- Sticky Sidebar for Table of Contents -->
        <aside class="sidebar">
            <h4>In this Chapter</h4>
            <ul class="toc-list" id="dynamic-toc">
                <!-- TOC will be injected here via JS -->
            </ul>
        </aside>

        <div id="content-wrapper">
            <div id="content">
                <div style="text-align: center; font-style: italic; color: var(--text-light);">Turning pages...</div>
            </div>
        </div>
        
    </div>

    <script>
        // Theme management
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
            document.body.setAttribute('data-theme', currentTheme);
        }

        function toggleTheme() {
            if (document.body.getAttribute('data-theme') === 'dark') {
                document.body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Markdown Loading & TOC Generation
        const markdownFile = 'IT457_Week6_Cloud_Architecture_Handbook.md';

        marked.setOptions({
            gfm: true,
            breaks: true,
            headerIds: true
        });

        async function loadContent() {
            const contentContainer = document.getElementById('content');
            try {
                const response = await fetch(markdownFile);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                let markdown = await response.text();
                
                // Parse markdown
                contentContainer.innerHTML = marked.parse(markdown);
                
                // Add IDs to headings if missing (Marked v5+ doesn't generate them by default)
                contentContainer.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(heading => {
                    if (!heading.id) {
                        heading.id = heading.textContent
                            .toLowerCase()
                            .replace(/[^\w\s-]/g, '')
                            .replace(/\s+/g, '-');
                    }
                });
                
                // Generate Dynamic Table of Contents
                buildTOC();

                // Handle hash navigation after async load
                if (window.location.hash) {
                    setTimeout(() => {
                        const target = document.getElementById(window.location.hash.substring(1));
                        if (target) target.scrollIntoView();
                    }, 100);
                }

            } catch (error) {
                contentContainer.innerHTML = `
                    <div style="text-align: center; color: var(--accent); padding: 40px; border: 1px solid var(--border);">
                        <h2>Chapter Missing</h2>
                        <p>Could not fetch <code>\${markdownFile}</code>.</p>
                        <p style="font-size: 0.9em; margin-top: 20px; font-style: italic; color: var(--text-light);">
                            Please view this file through a local web server (like VS Code Live Server).
                        </p>
                    </div>`;
                console.error('Error fetching markdown:', error);
            }
        }

        function buildTOC() {
            const content = document.getElementById('content');
            const tocList = document.getElementById('dynamic-toc');
            tocList.innerHTML = ''; // Clear previous

            // Find all h2 and h3 elements (excluding the manual TOC one if it exists)
            const headings = content.querySelectorAll('h2:not(#table-of-contents), h3');
            
            headings.forEach(heading => {
                const li = document.createElement('li');
                li.className = `toc-item \${heading.tagName.toLowerCase()}`;
                
                const a = document.createElement('a');
                a.href = `#\${heading.id}`;
                a.className = 'toc-link';
                
                // Clean up heading text (remove numbers like "1. " if desired, or keep them)
                a.textContent = heading.textContent;
                
                li.appendChild(a);
                tocList.appendChild(li);
            });
        }

        loadContent();
    </script>
</body>
</html>
